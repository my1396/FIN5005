# Both machines must render with the same quarto minor version, otherwise
# docs/ output (HTML markup, search.json, sitemap.xml, PDF) diverges and
# git sees churn on every render. This makes a mismatch fail loudly.
quarto-required: "1.10.*"

project:
  type: book
  output-dir: docs
  resources: 
    - "filters/emoji/*.png"
  render:
    - "*.qmd"
    - "*.ipynb"
    - "!Rscripts/"
    - "!_lab/"
    - "!_quiz/"

# only render changed files
execute:
  freeze: auto

# Define book structure
book:
  title: "FIN5005 Fall 2026"
  site-url: "https://my1396.github.io/FIN5005/"
  search: true
  downloads: 
    - pdf
  chapters:
    - part: "Introduction"
      chapters:
        - index.qmd
        - 00_environment_setup.qmd
        - 00_Lab-0_Intro_to_R.ipynb
        - 00_import-local-data-to-R.qmd
    - part: "Basics"
      chapters:
        - 01_introduction.qmd
        - 01_Lab-1_Descriptive-Statistics.ipynb
        - 02_Data_Visualization.qmd
        - 02_Lab-2_Data_Visualization_Asset_Returns.ipynb
        - 03_Linear_Regression.qmd
        - 04_Theoretical_Framework_LR.qmd
        - 05_Hypothesis_Testing.qmd
        - 06_Multiple_Linear_Regression.qmd
        - 07_Lab-3_dummy-variable.ipynb
    - part: "Advanced"
      chapters:
        - 08_Interactions.qmd
        - 09_Logistic_Regression.qmd

filters:
  - filters/color-text.lua  # Add color to text in pdf
  - filters/col-eqn.lua     # Add color to equations in pdf
  - filters/emoji.lua       # Add emoji support for pdf
  - filters/html-img.lua    # Convert <img> to \includegraphics for pdf

# Output formats, styles, dependencies
format:
  html:
    # Pin MathJax 3. Quarto 1.10 defaults to mathjax@4/tex-chtml.js, where the
    # colour extension was renamed to lowercase colorv2.js, so the
    # loader line in themes/mathjax.html ('[tex]/colorV2') 404s and \color is
    # left undefined. The -full bundle is required: it preloads every TeX
    # extension, including `color`, which \red/\green and \color[RGB] need.
    html-math-method:
      method: mathjax
      url: "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml-full.js"
    include-in-header: 
      - file: themes/mathjax.html       # MathJax for LaTeX custom macro support
      - file: themes/common-header.html # load js scripts and external css (e.g., font-awesome) for all pages
    from: markdown+tex_math_single_backslash+markdown_in_html_blocks
    respect-user-color-scheme: true
    theme:
      light: [cosmo, themes/custom-light.scss]
      dark: [darkly, themes/custom-dark.scss]
    toc: true
    toc-depth: 4
    number-sections: true
    number-depth: 3
  pdf:
    documentclass: scrbook
    papersize: a4
    pdf-engine: lualatex
    include-in-header:
      - file: latex/macro_book.tex
    from: markdown+tex_math_single_backslash+markdown_in_html_blocks
    keep-tex: true
    fontsize: 12pt
    fig-format: pdf
    colorlinks: true
    linkcolor: blue
    urlcolor: blue
    citecolor: blue

knitr:
  opts_chunk: 
    R.options:
      knitr.kable.NA = ''